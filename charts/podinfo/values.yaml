# Default values for podinfo. Environment-specific overrides live in environments/.

replicaCount: 2

image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 9898

ui:
  message: "Hello from Nadeem-Ahmed"
  color: "#34577c"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL


rollout:
  enabled: false
  steps:
    - setWeight: 33
    - pause: {}
    - setWeight: 66
    - pause:
        duration: 30s
